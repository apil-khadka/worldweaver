name: Deploy to Dokploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend
        run: |
          curl -X POST "${{ secrets.DOKPLOY_BACKEND }}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d '{"ref":"refs/heads/main","repository":{"full_name":"apil-khadka/worldweaver"}}' \
            --fail --silent --show-error

      - name: Deploy Frontend
        run: |
          curl -X POST "${{ secrets.DOKPLOY_FRONTEND }}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d '{"ref":"refs/heads/main","repository":{"full_name":"apil-khadka/worldweaver"}}' \
            --fail --silent --show-error
