name: Bug Report
description: Report a bug in WorldWeaver
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: WorldWeaver version
      placeholder: e.g. 0.1.0 or commit hash
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - simulation
        - networking
        - renderer
        - game
        - persistence
        - frontend
        - other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
