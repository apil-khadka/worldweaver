# WorldWeaver frontend nginx config
# Serves static Vite build + reverse-proxies WebSocket to backend service
#
# BACKEND_URL env var sets the backend address (default: http://worldweaver-backend:8080)

server {
    listen 80;
    server_name _;

    # DNS resolver for dynamic upstreams (Docker internal DNS)
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket reverse proxy to backend
    location /ws {
        set $backend_upstream "${BACKEND_URL}";
        proxy_pass $backend_upstream/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API proxy (health, metrics, etc.)
    location /health {
        set $backend_upstream "${BACKEND_URL}";
        proxy_pass $backend_upstream/health;
        proxy_set_header Host $host;
    }

    location /api/ {
        set $backend_upstream "${BACKEND_URL}";
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
