# docker-compose.yml — WorldWeaver
# Production deployment via Dokploy or any Docker host.
# Usage: docker compose up -d
# Frontend: http://localhost (landing + game at /play)
# Backend:  http://localhost:8080 (direct, for debugging)

services:
  worldweaver-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: worldweaver-backend
    restart: unless-stopped
    volumes:
      - world-data:/app/data
    environment:
      - TZ=UTC
      - WORLDWEAVER_ADDR=:8080
      - WORLDWEAVER_WIDTH=2048
      - WORLDWEAVER_HEIGHT=1024
      - WORLDWEAVER_SEED=20260823
      - WORLDWEAVER_MAX_PLAYERS=8
    expose:
      - "8080"
    ports:
      - "8080:8080"  # Direct backend access for debugging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - worldweaver

  worldweaver-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: worldweaver-frontend
    restart: unless-stopped
    environment:
      - BACKEND_HOST=worldweaver-backend
    ports:
      - "80:80"
    depends_on:
      worldweaver-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - worldweaver

volumes:
  world-data:
    driver: local

networks:
  worldweaver:
    driver: bridge
